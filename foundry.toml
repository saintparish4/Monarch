# Monarch build configuration.
#
# Why this file looks the way it does:
#   - `src` is `contracts/`, not Foundry's default `src/`, because the repo
#     already had that layout and moving four files to satisfy a default is
#     churn.
#   - `solc` is pinned exactly. A floating pragma on a contract that custodies
#     user deposits means the deployed bytecode depends on who compiled it.
#   - `deny_warnings` makes "zero warnings" a property CI can enforce instead
#     of a claim in a README.

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
deny = "warnings"
gas_reports = ["MonarchPaymaster"]
# The fork test only means something under the `fork` profile's compiler
# settings; under these it would compare two different builds and fail.
no_match_path = "test/fork/*"

# `forge lint` runs inside `forge build`, and `deny = "warnings"` makes it
# blocking. Scope it to `contracts/`: test code sends ETH to arbitrary addresses
# and reaches into internals on purpose, so production severities there are
# noise. Coverage is scoped the same way, for the same reason.
[lint]
ignore = ["test/*", "test/**/*", "script/*", "script/**/*", "cases/*", "cases/**/*"]

[profile.ci]
verbosity = 3
fuzz = { runs = 1024 }
invariant = { runs = 512, depth = 64, fail_on_revert = true }

# The bytecode check against the deployed EntryPoint. Compiled with the settings
# eth-infinitism shipped v0.8 with (via-IR, 1,000,000 runs), because that is the
# only way the EntryPoint compiled from `lib/` can be byte-identical to the one
# on chain. Scoped to `test/fork` so nothing else is compiled under via-IR.
[profile.fork]
test = "test/fork"
via_ir = true
optimizer_runs = 1_000_000
# Overrides the default profile's exclusion of `test/fork`. It can't be
# emptied: an empty glob excludes every test. `test/unit` isn't compiled under
# this profile anyway.
no_match_path = "test/unit/*"

# The failure cases: paymasters that are broken on purpose, each beside its
# fix, and the tests that show the difference. Their own profile, and not the
# default's `test` directory, so that nothing else sees them: `forge build`, the
# coverage floors, `slither .` and the gas snapshot all run under the default
# profile, and a contract written to be wrong has no business in any of them.
#
# Verbosity 3 is not cosmetic. It switches on Foundry's execution tracer, and
# `vm.startDebugTraceRecording`, which the cases use to see the opcodes a
# paymaster runs during validation the way a bundler does, fails without it.
[profile.cases]
test = "cases"
verbosity = 3

# Gas snapshots. Identical to the default except that the CBOR metadata hash is
# left out of the bytecode. Tests run isolated, so a `new X()` inside a test
# body pays calldata gas on X's initcode, 4 per zero byte and 16 per non-zero
# byte, and the metadata hash is part of that initcode. The hash covers source
# text, comments included, so with it in place a comment edit moved four
# snapshot entries by 12 gas. Without it, the snapshot moves only when code
# does.
#
# The fuzz settings serve the same end. The fuzzer seeds its inputs with
# constants harvested from every compiled contract, so adding an unrelated test
# changed the inputs, and with them the mean gas of every fuzz entry. A fixed
# seed and no dictionary make the inputs depend on the seed alone. Real fuzzing
# runs under the default and `ci` profiles, where the dictionary stays on.
[profile.gas]
bytecode_hash = "none"
fuzz = { seed = "0x4d4f4e41", dictionary_weight = 0 }

# The tests deploy the real EntryPoint v0.8 from `lib/` rather than a mock, which
# would agree with whatever I believe about the interface — and being wrong
# about that interface is what I am rebuilding. The fork test is what proves
# that local EntryPoint is the one deployed on Base Sepolia.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
